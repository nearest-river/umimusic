[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["macros"] }
reqwest = "0.13.1"
serde = { version = "1.0.228", features = ["serde_derive", "derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full", "tracing"] }
tracing = { version = "0.1.44", features = ["async-await"] }
tracing-subscriber = { version = "0.3.22", features = ["chrono", "json", "regex", "serde", "serde_json", "time", "tracing"] }
